[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hazardserve"
version = "0.1.0"
description = "Hazard-aware placement and pre-emptive migration for stateful LLM inference requests on unreliable nodes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "hazardserve contributors" }]
keywords = ["llm", "serving", "spot instances", "volunteer computing", "survival analysis", "scheduling", "kv cache"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]
traces = ["pandas>=2.0", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/lvlrSajjad/hazardserve"
Documentation = "https://lvlrSajjad.github.io/hazardserve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
